# Wrapper Gradle — version épinglée pour tout le monde (wrapper, pas la version
# installée sur la machine du développeur).
#
# Gradle 8.9 est choisi pour la compatibilité avec l'AGP du projet :
# `gradle/libs.versions.toml` déclare AGP 8.5.2, dont la version minimale de
# Gradle est 8.7 (sous Gradle 8.x). Gradle 9.x exige un AGP beaucoup plus récent
# (8.11+) : épingler 9.x casserait la configuration du projet.
#
# `distributionSha256Sum` est le SHA-256 **officiel** publié par Gradle pour
# `gradle-8.9-bin.zip`. Il est vérifié par le wrapper : une distribution
# substituée (proxy, miroir compromis) fait échouer le téléchargement au lieu
# d'être exécutée silencieusement.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
